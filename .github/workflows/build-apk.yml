name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Scaffold a Flutter project and copy in the game
        run: |
          flutter create --project-name fraud_check --org com.fraudcheck app
          cp lib/main.dart lib/categories.dart app/lib/
          cp -r assets app/assets
          cp pubspec.yaml app/pubspec.yaml
      - name: Generate the launcher icon from the app logo
        run: |
          cd app
          flutter pub get
          dart run flutter_launcher_icons
      - name: Build release APK
        run: |
          cd app
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fraud-check-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
